[project]
name = "epicsdev-ps-bk-9141"
version = "0.1.0"
description = "EPICS PVAccess server for the BK Precision 9141 power supply"
readme = "README.md"
authors = [
    { name = "Sukhanov, Andrei", email = "sukhanov@bnl.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "epicsdev>=3.3.4",
    "pyvisa>=1.15",
    "pyvisa-py>=0.8",
]

[project.scripts]
epicsdev-ps-bk-9141 = "epicsdev_ps_bk_9141.__main__:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
